[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codewiki"
version = "0.1.0"
description = "CLI tool for maintaining LLM-compiled code wikis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
cw = "codewiki.cli:main"

[tool.setuptools.packages.find]
include = ["codewiki*"]

[tool.setuptools.package-data]
codewiki = ["skills/*.md"]
